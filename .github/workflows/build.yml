name: Build iOS27LockScreen

on: push

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/work/theos/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/Users/runner/work/theos/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" -i $THEOS

      - name: Build
        run: |
          export THEOS=/Users/runner/work/theos/theos
          make clean THEOS_PACKAGE_SCHEME=rootless
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-rootless
          path: packages/
